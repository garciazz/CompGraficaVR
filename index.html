<!-- Esqueleto mínimo de uma cena A-Frame -->
<!DOCTYPE html>
<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene cursor="rayOrigin: mouse" raycaster="objects: .clickable">
		<a-sky color="#1dbdf2"></a-sky>
		<a-plane rotation="-90 0 0" width="60" height="60" color="#fc0505"></a-plane>
		<a-light type="ambient" color="#9a92b5" intensity="0.7"></a-light>
		<a-light type="directional" color="#ffffff" intensity="0.85" position="-1 3 2"></a-light>
		
		<a-box         rotation="0 0 0" scale="0.75 0.75 0.75" position="-2.5 1.5 -1" color="#ff5d8f" class="clickable"
animation__click="property: scale; from: 1 1 1; to: 1.25 1.25 1.25; dir: alternate; loop: 2; dur: 140; startEvents: click">
			<a-text value="Cubo" align="center" width="3" color="#EAEAF2" position="0 0.75 0"></a-text>
		</a-box>
		
		<a-sphere      position="-1.5 1.5 -1" radius="0.45" color="#ffb454" class="clickable"
animation__click="property: scale; from: 1 1 1; to: 1.25 1.25 1.25; dir: alternate; loop: 2; dur: 140; startEvents: click">
			<a-text value="Esfera" align="center" width="3" color="#EAEAF2" position="0 0.75 0"></a-text>
		</a-sphere>
			
		<a-cylinder    position="-0.5 1.5 -1" radius="0.4" height="0.9" color="#4fd1c5" class="clickable"
animation__click="property: scale; from: 1 1 1; to: 1.25 1.25 1.25; dir: alternate; loop: 2; dur: 140; startEvents: click">
			<a-text value="Cilindro" align="center" width="3" color="#EAEAF2" position="0 0.75 0"></a-text>
		</a-cylinder>
		
		<a-cone        position="0.5 1.5 -1" radius-bottom="0.5" radius-top="0" height="0.9" color="#63b3ed" class="clickable"
animation__click="property: scale; from: 1 1 1; to: 1.25 1.25 1.25; dir: alternate; loop: 2; dur: 140; startEvents: click">
			<a-text value="Cone" align="center" width="3" color="#EAEAF2" position="0 0.75 0"></a-text>
		</a-cone>
		
		<a-torus       position="1.5 1.5 -1" radius="0.4" radius-tubular="0.12" color="#b794f4" class="clickable"
animation__click="property: scale; from: 1 1 1; to: 1.25 1.25 1.25; dir: alternate; loop: 2; dur: 140; startEvents: click">
			<a-text value="Rosquinha" align="center" width="3" color="#EAEAF2" position="0 0.75 0"></a-text>
		</a-torus>
			
		<a-dodecahedron position="2.5 1.5 -1" radius="0.48" color="#f687b3" class="clickable"
animation__click="property: scale; from: 1 1 1; to: 1.25 1.25 1.25; dir: alternate; loop: 2; dur: 140; startEvents: click">
			<a-text value="Rosquinha" align="center" width="3" color="#EAEAF2" position="0 0.75 0"></a-text>
		</a-dodecahedron>
		
		<a-text value="Rafael Garcia Cerci" align="center" width="3" color="#EAEAF2" position="0 0.75 0"></a-text>
    </a-scene>
  </body>
</html>
